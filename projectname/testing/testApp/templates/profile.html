{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="text-center mb-4">
        <h2>{{ user_obj.username }}</h2>
        <p>{{ user_obj.email }}</p>
    </div>

    <hr>

    <h4 class="text-center mb-3">Your Uploads</h4>

    <div class="d-flex flex-wrap justify-content-center gap-3">
        {% for upload in uploads %}

            {% if upload.file.url|lower|slice:"-4:" == ".mp4" %}
                <video width="250" controls>
                    <source src="{{ upload.file.url }}">
                </video>
            {% else %}
                <img src="{{ upload.file.url }}" class="chord-img">
            {% endif %}

        {% empty %}
            <p>No uploads yet.</p>
        {% endfor %}
    </div>

</div>

{% endblock %}
