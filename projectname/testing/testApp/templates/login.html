{% extends "base.html" %}

{% block content %}
<h1 class="text-center text-primary m-0" style="z-index: 1030; background: white; width: 100%;">ChordBASE</h1>
    <span class="border border-1"></span>
  

<div class="d-flex justify-content-center align-items-center" style="min-height:80vh;">
  <div class="card p-4 shadow mx-auto " style="max-width:420px; width:100%;">

    <h2 class="text-center mb-3">Login</h2>

    <form method="post">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">Username:</label>
        <input type="text" class="form-control" name="username" placeholder="Enter username">
      </div>

      <div class="mb-3">
        <label class="form-label">Password:</label>
        <input type="password" class="form-control" name="password" placeholder="Enter password" >
      </div>

      <button type="submit" class="btn btn-success">Login</button>
    </form>

  <a href="{% url 'register' %}" class="mt-3">create account</a>
  </div>
</div>

{% endblock %}
