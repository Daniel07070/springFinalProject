{% extends "base.html" %}

{% block content %}
<style>
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url('/static/images/music-notes.png') repeat;
    background-size: 200px;
    opacity: 0.08;   /* makes it subtle */
    z-index: -1;
  }
</style>

  <h1 class="text-center text-primary m-0" style="z-index: 1030; background: white; width: 100%;">ChordBASE</h1>
    <span class="border border-1"></span>
  

  <div class="d-flex justify-content-center align-items-center" style="min-height:80vh;">
  <div class="card p-4 shadow mx-auto" style="max-width:600px; width:100%;">

    <h2 class="text-start mb-3">Register</h2>

   <form method="post">
  {% csrf_token %}

  <!-- Username -->
  <div class="mb-3">
    <label class="form-label">Username:</label>
    <input type="text" class="form-control" name="username" placeholder="Enter username">
  </div>

  <!-- Email -->
  <div class="mb-3">
    <label class="form-label">Email:</label>
    <input type="email" class="form-control" name="email" placeholder="Enter email">
  </div>

  <!-- Passwords side by side -->
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Password:</label>
      <input type="password" class="form-control" name="password" placeholder="Enter password">
    </div>

    <div class="col-md-6 mb-3">
      <label class="form-label">Re-enter Password:</label>
      <input type="password" class="form-control" name="confirm_password" placeholder="Re-enter password">
    </div>
  </div>

  <button type="submit" class="btn btn-success">Signup</button>
</form>
    <a href="{% url 'login' %}" class="mt-3">Login</a>
  </div>
</div>
  </div>
{% endblock %}
