{% extends "base.html" %}

{% block content %}

<form>
    <input type="text" name = "q" placeholder="Search...">
    <button type="submit">Search</button>
</form>

<ul>
    {% for chord in chords %}
        <li>
            {{chord.name}} - {{chord.notes}}
        </li>
    {% endfor%}

</ul>

{% endblock %}
